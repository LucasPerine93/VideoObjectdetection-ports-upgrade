services:
  ei-video-obj-detection-runner1:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/ei-models-runner:0.11.2
    cpuset: "0,1"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"     
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:4914:4912  # Embedded UI port
      - ${BIND_ADDRESS_IPV6:-[::]}:4914:4912  # Embedded UI port
    volumes:
      - "${CUSTOM_MODEL_PATH:-/home/arduino/.arduino-bricks}:${CUSTOM_MODEL_PATH:-/home/arduino/.arduino-bricks}"
      - /var/lib/arduino-app-cli/models/edge-impulse:/var/lib/arduino-app-cli/models/edge-impulse
    command: ["--model-file", "${EI_V_OBJ_DETECTION_MODEL:-/models/ootb/ei/yolo-x-nano.eim}", "--gst-source", "tcpserversrc host=0.0.0.0 port=5050 ! jpegdec", "--dont-print-predictions", "--preview-original-resolution"]
    healthcheck:
      test: [ "CMD-SHELL", "grep -i ':13BA' /proc/net/tcp | grep ' 0A ' || exit 1" ] # Hex encoding of port 5050
      interval: 2s
      timeout: 2s
      retries: 25

  ei-video-obj-detection-runner2:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/ei-models-runner:0.11.2
    cpuset: "2,3"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"     
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:4910:4912  # Embedded UI port
      - ${BIND_ADDRESS_IPV6:-[::]}:4910:4912  # Embedded UI port
    volumes:
      - "${CUSTOM_MODEL_PATH:-/home/arduino/.arduino-bricks}:${CUSTOM_MODEL_PATH:-/home/arduino/.arduino-bricks}"
      - /var/lib/arduino-app-cli/models/edge-impulse:/var/lib/arduino-app-cli/models/edge-impulse
    command: ["--model-file", "${EI_V_OBJ_DETECTION_MODEL:-/models/ootb/ei/yolo-x-nano.eim}", "--gst-source", "tcpserversrc host=0.0.0.0 port=5051 ! jpegdec", "--dont-print-predictions", "--preview-original-resolution"]
    healthcheck:
      test: [ "CMD-SHELL", "grep -i ':13BB' /proc/net/tcp | grep ' 0A ' || exit 1" ] # Hex encoding of port 5051
      interval: 2s
      timeout: 2s
      retries: 25
